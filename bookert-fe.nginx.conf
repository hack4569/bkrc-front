# =============================================================================
# BookerT 프론트엔드 nginx 설정 (AWS EC2, 백엔드와 동일 인스턴스)
#
# 배치 경로 예시: /etc/nginx/conf.d/bookert-fe.conf
#  - 프론트 정적 파일을 서빙하고, /api/* 요청을 같은 머신의 백엔드(8080)로 프록시한다.
#  - 기존 Cloudflare Pages 구성(functions/api 프록시 + _headers 보안헤더)을 그대로 대체한다.
#
# !!! 적용 전 바꿔야 할 값 !!!
#   1) server_name          : 실제 도메인으로 (예: bookert.example.com)
#   2) root                 : dist 파일을 올린 실제 경로로
#   3) ssl_certificate 경로 : certbot 실행 후 자동으로 채워지거나 아래처럼 수동 지정
# =============================================================================

# ---------------------------------------------------------------------------
# (A) HTTP(80) → HTTPS(443) 리다이렉트 + Let's Encrypt 갱신 통로
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name 54.180.172.47;          # ← 실제 도메인으로 교체

    # certbot 인증서 발급/갱신용 경로는 리다이렉트에서 제외
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# (B) HTTPS(443) 본 서버
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name 54.180.172.47;          # ← 실제 도메인으로 교체

    # --- TLS 인증서 (certbot --nginx 실행 시 이 두 줄은 자동 주입됨) ---
    ssl_certificate     /etc/letsencrypt/live/bookert.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookert.example.com/privkey.pem;

    # --- 프론트 정적 파일 위치 (dist 내용물을 올린 경로) ---
    root  /var/www/bookert-fe;                # ← 실제 배포 경로로 교체
    index index.html;

    # -----------------------------------------------------------------------
    # 보안 응답 헤더
    #   기존 Cloudflare _headers를 그대로 옮긴 것.
    #   ※ nginx의 add_header는 하위 location이 자체 add_header를 가지면
    #     "상속되지 않는다". 그래서 여기 server 레벨에 모아두고,
    #     아래 location 블록에서는 add_header를 절대 다시 쓰지 않는다.
    #     (location에 add_header를 넣는 순간 이 6개 헤더가 그 location에서 통째로 사라짐)
    # -----------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HTTPS 강제(HSTS) — 4단계 certbot으로 HTTPS가 적용된 뒤 유효하다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # API 프록시: /api/* → 같은 머신의 백엔드 8080
    #   기존 Cloudflare 함수가 하던 일을 그대로 대체한다.
    #   ※ proxy_pass 끝의 "/" 와 location 끝의 "/" 가 둘 다 있어야
    #     /api/v1/member/me → 127.0.0.1:8080/v1/member/me 로 올바르게 매핑된다.
    #     (둘 중 하나라도 빠지면 /api 접두어가 백엔드로 그대로 새서 404가 난다)
    # -----------------------------------------------------------------------
    location /api/ {
        # 127.0.0.1 은 백엔드가 같은 EC2의 localhost(8080)에 바인딩돼 있다는 전제다.
        # 0.0.0.0/사설IP 에만 바인딩돼 있으면 이 주소를 그에 맞게 바꿀 것.
        proxy_pass http://127.0.0.1:8080/;

        proxy_http_version 1.1;
        # 기존 Cloudflare 함수는 백엔드에 업스트림 호스트네임(...nip.io)을 Host로 넘겼다.
        # 여기선 클라이언트 도메인($host)을 넘긴다. 백엔드가 Host 헤더를 검증하거나
        # 절대 URL 생성에 쓴다면 이 값을 백엔드가 기대하는 호스트로 조정할 것.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 기존 CF 함수가 제거하던 와일드카드 CORS 헤더를 백엔드가 내려보내더라도 숨김
        # (/api는 앱과 동일 출처라 CORS 헤더가 불필요하며, 오픈 릴레이 방지)
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # -----------------------------------------------------------------------
    # SPA 라우팅: 실제 파일이 없으면 index.html로 폴백
    #   react-router 경로(/login, /mypage 등)가 새로고침 시 404 안 나도록.
    #   해시 파일명이 붙은 정적 자산(/assets/*)도 이 블록에서 그대로 서빙되며,
    #   server 레벨 보안 헤더 6종이 모든 응답에 일관되게 적용된다.
    #   (location별 add_header를 두지 않는 것은 의도적 — 헤더 상속이 깨지지 않도록)
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
